; redRover portable firmware.
;
;   pio run                 build every board
;   pio run -e uno          build one
;   pio run -e uno -t upload
;   pio test -e native      run the host-side unit tests
;
; The core library has no Arduino dependency, so `native` compiles and tests
; the protocol, the sensor registry, and the drive kinematics on the host.

[platformio]
default_envs = uno, mega2560, nanoatmega328, esp32dev, pico, teensy41

[env]
framework = arduino
lib_deps =
build_flags =
    -Wall
    -Wextra
monitor_speed = 115200

; ---------------------------------------------------------------------------
; AVR — the constrained baseline. If it fits here, it fits anywhere.
; 2 KB of SRAM is why the core has no dynamic allocation and fixed-size tables.
; ---------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=6
    -DREDROVER_MAX_FRAME=64

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=6
    -DREDROVER_MAX_FRAME=64

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=16

; ---------------------------------------------------------------------------
; ESP32 — WiFi/BLE, FPU, the natural choice for an untethered rover.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=24
    -DREDROVER_MAX_FRAME=192

[env:esp32-wifi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DREDROVER_EXAMPLE_ESP32_WIFI
    ; Supply credentials at build time rather than committing them:
    ;   -DREDROVER_WIFI_SSID='"my-network"'
    ;   -DREDROVER_WIFI_PASS='"my-password"'

; ---------------------------------------------------------------------------
; RP2040 / Teensy — fast enough for kHz-rate vibration sampling.
; ---------------------------------------------------------------------------
[env:pico]
platform = raspberrypi
board = pico
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=24
    -DREDROVER_MAX_FRAME=192

[env:teensy41]
platform = teensy
board = teensy41
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=32
    -DREDROVER_MAX_FRAME=192

[env:teensy40]
extends = env:teensy41
board = teensy40

; ---------------------------------------------------------------------------
; STM32 — Blue Pill and Nucleo class boards.
; ---------------------------------------------------------------------------
[env:bluepill]
platform = ststm32
board = bluepill_f103c8
build_flags =
    ${env.build_flags}
    -DREDROVER_MAX_SENSORS=16

; ---------------------------------------------------------------------------
; Example variants, built in CI so they cannot rot.
; ---------------------------------------------------------------------------
[env:mega2560-mecanum]
extends = env:mega2560
build_flags =
    ${env:mega2560.build_flags}
    -DREDROVER_EXAMPLE_MECANUM

[env:mega2560-addsensor]
extends = env:mega2560
build_flags =
    ${env:mega2560.build_flags}
    -DREDROVER_EXAMPLE_ADD_SENSOR

; ---------------------------------------------------------------------------
; Host-side unit tests. No framework, no board, no Arduino.
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DREDROVER_MAX_SENSORS=12
test_framework = unity
