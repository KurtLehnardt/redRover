name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR that targets another feature branch still
  # needs its checks to run, and only running on PRs into main means the
  # bottom of a stack is the only thing ever tested.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the real requirements file so a broken or missing dependency
      # fails CI instead of only failing on a developer's clean machine.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short --timeout=120

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware for every supported board
        run: pio run -d firmware

      - name: Uno still fits
        # The whole premise is that this runs on the smallest board anyone
        # would use. Without a gate, a change that stops fitting is found on
        # hardware instead of here.
        run: |
          pio run -d firmware -e uno 2>&1 | tee /tmp/uno_build.log
          used=$(grep -oE 'RAM:.*used ([0-9]+) bytes' /tmp/uno_build.log \
                 | grep -oE '[0-9]+ bytes' | grep -oE '[0-9]+')
          echo "Uno static RAM: ${used} bytes of 2048"
          if [ -z "$used" ]; then echo "could not read the size report"; exit 1; fi
          # 1 KB ceiling leaves the other half of SRAM for the stack.
          if [ "$used" -gt 1024 ]; then
            echo "::error::Uno static RAM ${used} B exceeds the 1024 B budget"
            exit 1
          fi
      - name: Run native firmware unit tests
        run: pio test -d firmware -e native

      - name: Golden wire vectors match the C++ implementation
        # The Python host mirrors the protocol by hand. Regenerating the
        # vectors here means a change to the C++ side that breaks byte
        # compatibility fails CI instead of failing on a robot.
        run: |
          g++ -std=c++17 -Wall -Wextra -Ifirmware/lib/RedRover/src \
            firmware/lib/RedRover/src/Framing.cpp \
            firmware/lib/RedRover/src/Protocol.cpp \
            firmware/tools/gen_vectors.cpp -o /tmp/gen_vectors
          /tmp/gen_vectors > /tmp/wire_vectors.json
          diff -u tests/data/wire_vectors.json /tmp/wire_vectors.json
