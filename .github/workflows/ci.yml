name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR that targets another feature branch still
  # needs its checks to run, and only running on PRs into main means the
  # bottom of a stack is the only thing ever tested.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      # `ruff format --check` is deliberately not enforced yet: the tree has
      # never been auto-formatted, and reformatting 36 files would bury real
      # changes in whitespace. Run `ruff format .` as its own commit first.

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the real requirements file so a broken or missing dependency
      # fails CI instead of only failing on a developer's clean machine.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short --timeout=120
